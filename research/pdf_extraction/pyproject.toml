[project]
name = "pdf-extraction-evaluation"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pypdf==6.21.0",
    "pydantic>=2.10,<3",
    "reportlab>=4.4,<5",
    "pillow>=13,<14",
]
[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1", "mypy>=1.14,<2"]
[tool.uv]
package = false
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.13"
files = ["metrics.py", "schemas"]
strict = true
