name: Foundation CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: adaptive_ci_test
          POSTGRES_USER: adaptive_ci
          # Public synthetic credential used only by this disposable CI service.
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adaptive_ci -d adaptive_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://adaptive_ci:ci_only_password@127.0.0.1:5432/adaptive_ci_test
      TEST_DATABASE_URL: postgresql+psycopg://adaptive_ci:ci_only_password@127.0.0.1:5432/adaptive_ci_test
      POSTGRES_PASSWORD: ci_only_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned uv
        run: python -m pip install uv==0.12.23
      - name: Check backend
        run: sh scripts/check_backend.sh
      - name: Upgrade shared migration history and check schema drift
        working-directory: apps/backend
        run: |
          uv run --locked alembic upgrade head
          uv run --locked alembic check
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build backend image
        run: docker compose build backend
